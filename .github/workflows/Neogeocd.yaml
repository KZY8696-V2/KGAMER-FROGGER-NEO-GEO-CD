name: Build Neo Geo CD Frogger

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            wget \
            genisoimage \
            binutils-m68k-linux-gnu \
            gcc-m68k-linux-gnu

      - name: Setup Neodev SDK
        run: |
          git clone --depth 1 https://github.com/sevii/neodev.git || true
          cd neodev && make && sudo make install || true
          cd ..

      - name: Compile Project (Make)
        run: |
          make clean
          make

      - name: Package Neo Geo CD ISO
        run: |
          mkdir -p cd_root
          cp frogger.elf cd_root/BOOT.PRG
          
          echo "FROGGER NEO GEO CD / CDZ" > cd_root/IPL.TXT
          echo "BOOT = /BOOT.PRG" >> cd_root/IPL.TXT

          genisoimage -V "FROGGER_CD" -d -r -o frogger.iso cd_root/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frogger-neogeocd-iso
          path: frogger.iso
