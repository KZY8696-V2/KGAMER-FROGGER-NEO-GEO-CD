name: Neo Geo CD Frogger VASM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            wget \
            unzip \
            genisoimage \
            vasm

      - name: Assemble main.asm
        run: |
          vasmm68k_mot -Fbin -nosym -o frogger.bin main.asm

      - name: Create Neo Geo CD ISO Image
        run: |
          mkdir -p iso_root
          cp frogger.bin iso_root/BOOT.PRG
          
          echo "FROGGER NEO GEO CD" > iso_root/IPL.TXT
          echo "BOOT = /BOOT.PRG" >> iso_root/IPL.TXT

          genisoimage -V "FROGGER_CD" -d -r -o frogger.iso iso_root/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frogger-neogeocd-iso
          path: frogger.iso
