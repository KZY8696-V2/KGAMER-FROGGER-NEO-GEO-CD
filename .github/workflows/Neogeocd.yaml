name: Build Neo Geo CD Frogger

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget git genisoimage binutils-m68k-linux-gnu gcc-m68k-linux-gnu

      - name: Setup Neodev SDK
        run: |
          # Neodev SDK ve m68k toolchain entegrasyonu
          git clone https://github.com/sevii/neodev.git || true
          cd neodev && make && sudo make install || true
          cd ..

      - name: Compile Project (Make)
        run: |
          make clean
          make

      - name: Package Neo Geo CD ISO
        run: |
          mkdir -p cd_root
          # Derlenen binary dosyasını CD kök dizinine kopyala (Neo Geo CD boot formatı)
          cp frogger.elf cd_root/BOOT.PRG
          
          # IPL.TXT (Neo Geo CD Başlık ve Açılış Bilgisi) oluştur
          echo "FROGGER NEO GEO CD / CDZ" > cd_root/IPL.TXT
          echo "BOOT = /BOOT.PRG" >> cd_root/IPL.TXT

          # ISO imajını oluştur
          genisoimage -V "FROGGER_CD" -d -r -o frogger.iso cd_root/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frogger-neogeocd-iso
          path: frogger.iso
